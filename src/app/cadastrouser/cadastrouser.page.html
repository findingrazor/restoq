<div class="ion-page" id="main-content">
  <ion-content>
    <ion-header class="ion-no-border">
      <ion-toolbar class="toolbar-cadastro">
        <ion-buttons slot="start" class="botao-fechar" routerLink="/login">
          <ion-icon name="close" slot="icon-only"></ion-icon>
        </ion-buttons>
        <ion-title></ion-title>
      </ion-toolbar>
    </ion-header>
    <form [formGroup]="credentials" (ngSubmit)="register()">
      <div class="ion-padding">
        <div>
          <h1 class="titulo">Bem-Vindo!</h1>
          <p class="texto">Cadastre-se para entrar no aplicativo!</p>
        </div>
        <br>
        <div class="input-container">
          <ion-list class="input-list">
            <div class="campo-grupo">
              <h4 class="titulo-input">Nome</h4>
              <ion-item class="campo">
                <ion-input placeholder="Digite seu nome"></ion-input>
              </ion-item>
            </div>
            <br>
            <div class="campo-grupo">
              <h4 class="titulo-input">Email</h4>
              <ion-item class="campo">
                <ion-input type="email" placeholder="Digite seu email" formControlName="email"></ion-input>
              </ion-item>
            </div>
            <br>
            <div class="campo-grupo">
              <h4 class="titulo-input">Telefone</h4>
              <ion-item class="campo">
                <ion-input type="tel" placeholder="Digite seu telefone"></ion-input>
              </ion-item>
            </div>
            <br>
            <div class="campo-grupo">
              <h4 class="titulo-input">CPF</h4>
              <ion-item class="campo">
                <ion-input placeholder="Digite seu CPF"></ion-input>
              </ion-item>
            </div>
            <br>
            <div class="campo-grupo">
              <h4 class="titulo-input">Senha</h4>
              <ion-item class="campo">
                <ion-input type="password" placeholder="Digite sua senha" formControlName="password"></ion-input>
              </ion-item>
            </div>
            <br>
            <div class="campo-grupo">
              <h4 class="titulo-input">Confirmação Senha</h4>
              <ion-item class="campo">
                <ion-input type="password" placeholder="Confirme sua senha"></ion-input>
              </ion-item>
            </div>
          </ion-list>
        </div>
        <br>
        <div class="buttons-container">
          <ion-button shape="round" type="submit" expand="block">ENTRAR</ion-button>
        </div>
      </div>
    </form>
    <div class="footer">
      <div class="footer-art">
        <img class="onda onda-1" src="assets/footer/onda4.svg" alt="" />
        <img class="onda onda-2" src="assets/footer/onda5.svg" alt="" />
        <img class="onda onda-3" src="assets/footer/onda6.svg" alt="" />
      </div>
    </div>
  </ion-content>
</div>
